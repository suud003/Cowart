appId: com.yogurtai.desktop
productName: Yogurt AI Beta
copyright: Copyright © 2026 Yogurt AI contributors

asar: true
npmRebuild: false

directories:
  output: output/desktop
  buildResources: packaging

# Keep the application archive intentionally small. The desktop runtime is
# unpacked because Codex launches the MCP server in a separate Node process;
# external processes cannot execute JavaScript from an app.asar virtual path.
files:
  - package.json
  - package-lock.json
  - index.html
  - vite.config.js
  - packaging/desktop-bootstrap.cjs
  - desktop/**/*
  - dist/**/*
  - mcp/**/*
  - public/**/*
  - src/**/*
  - scripts/start-mcp.mjs
  - scripts/vite-build-once.mjs
  - skills/**/*
  - .codex-plugin/plugin.json
  - plugin.json
  - LICENSE
  - licenses/**/*
  - node_modules/**/*
  # tldraw remains available only to source-level legacy tests and migration work.
  # The production desktop runs the official Excalidraw package and must not ship
  # the tldraw runtime or the retired tldraw application entry points.
  - "!node_modules/tldraw/**/*"
  - "!node_modules/@tldraw/**/*"
  - "!mcp/lib/thinking-canvas.mjs"
  - "!src/App.jsx"
  - "!src/ExcalidrawWorkspace.jsx"
  - "!src/ThinkingReviewToolbar.jsx"
  - "!src/agentLasso.js"
  - "!src/annotationContext.js"
  - "!src/canvasSnapshot.js"
  - "!src/cowartGeoTypes.js"
  - "!src/cowartTheme.js"
  - "!src/cowartTldrawAssets.js"
  - "!licenses/TLDRAW-LICENSE.md"
  - "!**/{test,tests,__tests__}/**/*"
  - "!**/*.{map,tsbuildinfo}"

asarUnpack:
  - package.json
  - package-lock.json
  - index.html
  - vite.config.js
  - desktop/**/*
  - dist/**/*
  - mcp/**/*
  - public/**/*
  - src/**/*
  - scripts/start-mcp.mjs
  - scripts/vite-build-once.mjs
  - skills/**/*
  - .codex-plugin/plugin.json
  - plugin.json
  - LICENSE
  - licenses/**/*
  - node_modules/**/*
  - "!node_modules/tldraw/**/*"
  - "!node_modules/@tldraw/**/*"
  - "!mcp/lib/thinking-canvas.mjs"
  - "!src/App.jsx"
  - "!src/ExcalidrawWorkspace.jsx"
  - "!src/ThinkingReviewToolbar.jsx"
  - "!src/agentLasso.js"
  - "!src/annotationContext.js"
  - "!src/canvasSnapshot.js"
  - "!src/cowartGeoTypes.js"
  - "!src/cowartTheme.js"
  - "!src/cowartTldrawAssets.js"
  - "!licenses/TLDRAW-LICENSE.md"

# electron-builder intentionally omits npm lockfiles from app.asar. The MCP
# widget source hash includes this file, so place the exact lockfile beside the
# unpacked runtime explicitly.
extraResources:
  - from: package-lock.json
    to: app.asar.unpacked/package-lock.json

win:
  icon: packaging/yogurt-ai-icon.png
  executableName: Yogurt AI Beta
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: Yogurt-AI-Beta-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Yogurt AI Beta
  uninstallDisplayName: Yogurt AI Beta
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  license: LICENSE

publish: null
