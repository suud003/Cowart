<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 互动影游系统语义框线图</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ffffff;
      --ink: #0a0a0a;
      --body: #171717;
      --muted: #737373;
      --hairline: #e5e5e5;
      --link: #0348ed;
      --warning: #fe7e0f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: clamp(0.75rem, 2.2vw, 2rem);
    }

    .diagram-shell {
      width: min(100%, 96rem);
      min-width: 0;
      margin: 0 auto;
    }

    .diagram-header {
      display: grid;
      gap: 0.5rem;
      margin: 0 0 1rem;
    }

    .diagram-header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.3vw, 2rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .diagram-header p {
      max-width: 72rem;
      margin: 0;
      color: var(--body);
      font-size: clamp(0.84rem, 1.3vw, 1rem);
      line-height: 1.65;
    }

    .diagram-header .source-note {
      color: var(--muted);
      font-size: clamp(0.76rem, 1.15vw, 0.9rem);
    }

    .cowart-diagram {
      width: 100%;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--hairline);
      background: var(--canvas);
    }

    .cowart-diagram svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    [data-cowart-stroke] {
      vector-effect: non-scaling-stroke;
    }

    .node-frame {
      fill: var(--canvas);
      stroke: var(--ink);
      stroke-width: 1.6;
    }

    .node-warning {
      fill: var(--canvas);
      stroke: var(--warning);
      stroke-width: 2;
    }

    .node-rule {
      fill: none;
      stroke: var(--hairline);
      stroke-width: 1.2;
    }

    .edge {
      fill: none;
      stroke: var(--link);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge-arrow {
      fill: var(--link);
      stroke: none;
    }

    .object-label {
      fill: var(--ink);
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .object-detail {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 450;
    }

    .edge-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0.02em;
    }

    .layer-label {
      fill: var(--body);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .trace-label {
      fill: var(--muted);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    .assumption-badge {
      fill: var(--canvas);
      stroke: var(--warning);
      stroke-width: 1.4;
    }

    .assumption-text {
      fill: var(--warning);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    @media (max-width: 720px) {
      body {
        padding: 0.55rem;
      }

      .diagram-header {
        margin-bottom: 0.7rem;
      }

      .cowart-diagram {
        overflow-x: auto;
      }

      .cowart-diagram svg {
        min-width: 46rem;
      }
    }
  </style>
</head>

      <p class="source-note">输入仅有用户提出的“AI 互动影游”Case。下列系统对象、关系与职责均为 assumption，待用户判断与 TAPD 事实验证。</p>
